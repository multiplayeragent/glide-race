<script type="module">
/* ═══ GLIDE RACE · a Multiplayer Agent starter ════════════════════════════════════════
 * Paper planes race down through a giant house: launch off the top of a bookshelf, glide
 * room to room through the doorways, ride the warm air up from the floor vents, fly
 * through the gold rings for speed, and out of the window at the end. You lose height
 * all the time; hit a wall or the furniture and you start again from the last doorway.
 * Versus, 2–8 players; bots fill empty seats.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ gliding physics, the doorways, rings, vents, bots, timers
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   COURSE ........ the rooms, doorways, rings, vents and furniture (the same for everyone)
 *   WORLD ......... floors, walls, the furniture, the garden outside, effects
 *   PLANES ........ the paper plane model, and ONE physics function that flies any plane
 *   RACE (HOST) ... the race phases (grid, race, done) and the bots. Only the host writes these.
 *   MY PLANE ...... input, rings, crashes, doorways, the finish. Each player writes only its own.
 *   HUD & RESULTS . place, time, rings, countdown, results, leaderboard
 *   INPUT ......... keyboard and touch
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - Each player flies its OWN plane with its own physics and writes its own entity: `k`
 *     (one packed JSON field: race id, position, heading, pitch, roll, velocity, last
 *     doorway, rings, finish time, crashed-until) about 15 times a second, `hb` (heartbeat)
 *     once a second, and `n`/`c` (name, color) once. Planes pass through each other.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. Only the host writes the shared fields `race` (id, version
 *     `v`, phase, start and end times, results) and `bots`. A new host adopts both.
 *   - The course is built from a fixed seed, so it is never sent.
 *   - A new race starts only when the host bumps race.id; every client then goes back to
 *     the top of the bookshelf. Someone who joins mid-race starts there with their own clock.
 *   - Intent: "again" {} from the results card asks the host to start the next race now.
 *   - ?attract plays offline with bots only (the preview video is recorded from it).
 *   - Leaderboard "best-flight": each player's fastest flight (stored as 600000 - ms, so
 *     higher is better), shown on the results card.
 */
import * as THREE from "three";

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,               // bots fill the race up to this many planes
  hallW: 90, hallH: 130,  // the house's hallway: width and height (the floor is y = 0)
  roomLen: 150,           // each room's length; a wall with a doorway closes each one
  // Each wall's doorway: [x, y] of its middle. The last one is the open window: the finish.
  doors: [[0, 82], [-18, 64], [15, 72], [-10, 50], [20, 56], [-15, 38], [0, 26]],
  doorW: 30, doorH: 28, windowW: 40, windowH: 32,
  startY: 96,             // launch height (the top of the bookshelf)
  launch: 28,             // speed at GO
  vmax: 58, vmin: 8,      // speed limits
  stall: 14,              // below this the nose drops
  gravity: 20,            // pulls you faster when you dive, slower when you climb
  drag: 0.0018,           // air drag (times speed squared)
  sink: 2.4,              // height you lose every second whatever you do
  pitchRate: 1.5,         // nose up/down, radians/s
  trim: -0.06,            // where the nose settles on its own
  maxRoll: 0.85, turnRate: 1.6, // banking and turning
  ringR: 7, ringBoost: 10, // ring size, and the speed one gives you
  ventR: 10, ventLift: 34, // warm-air vents: width, and how hard they push you up
  crashFor: 1400,         // ms you tumble before you're back at the last doorway
  countdown: 5000,        // ms on the shelf before GO
  afterFirst: 25000,      // ms the race stays open after the first finisher
  botsAfterLast: 6000,    // ...or this long after the last person finishes, so bots close behind still get a time
  resultsFor: 12000,      // ms the results show before the next race
  botSkill: [0.72, 0.95], // bots' aim
  botLookAhead: 12,       // bots turn for the next ring or doorway this far before the one they are flying through, so they line up in time
  board: "best-flight",

const BOT_NAMES = ["Origami", "Crease", "Fold", "Swoop", "Doodle", "Dart", "Paperclip"];
const COLORS = ["#ff4d4d", "#3da5ff", "#ffd23f", "#52d273", "#c77dff", "#ff8c42", "#ff6fb5", "#3de0d0"];

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'glide-race',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',

const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */

    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),

    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);

    console.warn("Playing offline:", e && e.message);

const memo = new Map();

function shared(key, fb) {
  const raw = S.shared[key], m = memo.get(key);
  if (m && m.raw === raw) return m.v;
  const v = parse(raw, fb); memo.set(key, { raw, v }); return v;
}
let net = null, S = { entities: { players: {} }, shared: {} }, dropped = false;
const seenHb = new Map();
function livePlayers() {

    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);

}
let wakeHold = 0, lastFrameAt = 0; // a tab whose frames stopped (frozen, or in the background) doesn't act as host, nor for 700ms after it wakes (see frame())

// ── COURSE ──────────────────────────────────────────────────────────────────────────
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const HW = CONFIG.hallW / 2, RL = CONFIG.roomLen, START = { x: 0, y: CONFIG.startY, z: 6 };
// Walls: one at the end of each room, with a doorway (the last one: a big open window).
const WALLS = CONFIG.doors.map(([x, y], k) => {
  const last = k === CONFIG.doors.length - 1, w = last ? CONFIG.windowW : CONFIG.doorW, h = last ? CONFIG.windowH : CONFIG.doorH;
  return { z: (k + 1) * RL, x, y, x0: x - w / 2, x1: x + w / 2, y0: y - h / 2, y1: y + h / 2, last };
});
const FINISH_Z = WALLS[WALLS.length - 1].z;
const BOXES = []; // everything solid: { x0, y0, z0, x1, y1, z1 } (the walls around the doorways, the furniture)
const box = (x0, y0, z0, x1, y1, z1, kind) => { const b = { x0, y0, z0, x1, y1, z1, kind }; BOXES.push(b); return b; };
for (const w of WALLS) { // a wall is four boxes round its doorway
  box(-HW, 0, w.z - 1, w.x0, CONFIG.hallH, w.z + 1, "wall"); box(w.x1, 0, w.z - 1, HW, CONFIG.hallH, w.z + 1, "wall");
  box(w.x0, 0, w.z - 1, w.x1, w.y0, w.z + 1, "wall"); box(w.x0, w.y1, w.z - 1, w.x1, CONFIG.hallH, w.z + 1, "wall");
}
// The flying line: start → rings → doorway → rings → doorway ... Rings and vents sit on it.
const RINGS = [], VENTS = [], TARGETS = [];
{
  const rnd = mulberry32(42);
  let a = START;
  WALLS.forEach((w, k) => {
    const b = { x: w.x, y: w.y, z: w.z - 4 };
    for (const f of [0.38, 0.72]) {
      const r = { x: lerp(a.x, b.x, f) + (rnd() - 0.5) * 18, y: lerp(a.y, b.y, f) + 4 + rnd() * 4, z: lerp(a.z, b.z, f) };
      RINGS.push(r); TARGETS.push(r);
    }
    TARGETS.push({ x: w.x, y: w.y, z: w.z + 2, door: k });
    const vz = lerp(a.z, b.z, 0.55), vx = lerp(a.x, b.x, 0.55) + (rnd() - 0.5) * 10;
    VENTS.push({ x: clamp(vx, -HW + 12, HW - 12), z: vz, top: Math.max(a.y, b.y) + 14 });
    a = { x: w.x, y: w.y, z: w.z + 2 };
  });
}
/** How far point p is from the flying line (to keep furniture off it). */
function lineDist(x, y, z) {
  let best = Infinity, a = START;
  for (const b of TARGETS) { for (let t = 0; t <= 1; t += 0.1) best = Math.min(best, Math.hypot(x - lerp(a.x, b.x, t), y - lerp(a.y, b.y, t), z - lerp(a.z, b.z, t))); a = b; }
  return best;
}
function boxClear(x0, y0, z0, x1, y1, z1) { // is a box at least 12 units from the flying line everywhere?
  for (let u = 0; u <= 1; u += 1 / 3) for (let v = 0; v <= 1; v += 1 / 3) for (let w = 0; w <= 1; w += 1 / 3) if (lineDist(lerp(x0, x1, u), lerp(y0, y1, v), lerp(z0, z1, w)) < 12) return false;
  return true;
}
// Furniture: giant tables, chairs, sofas, lamps and bookcases, each room its own mix.
const FURNITURE = [];
{
  const rnd = mulberry32(7);
  for (let k = 0; k < WALLS.length; k++) {
    const z0 = k * RL + 20, z1 = (k + 1) * RL - 14;
    for (let tries = 0, placed = 0; tries < 40 && placed < 4; tries++) {
      const kind = ["table", "chair", "sofa", "lamp", "shelf"][Math.floor(rnd() * 5)], z = lerp(z0, z1, rnd());
      let parts;
      if (kind === "table") { const x = (rnd() - 0.5) * 40; parts = [[x - 20, 26, z - 12, x + 20, 29, z + 12], ...[[-18, -10], [18, -10], [-18, 10], [18, 10]].map(([dx, dz]) => [x + dx - 1.2, 0, z + dz - 1.2, x + dx + 1.2, 26, z + dz + 1.2])]; }
      else if (kind === "chair") { const x = (rnd() - 0.5) * 60; parts = [[x - 8, 15, z - 8, x + 8, 17, z + 8], [x - 8, 17, z + 6, x + 8, 40, z + 8], ...[[-7, -7], [7, -7], [-7, 7], [7, 7]].map(([dx, dz]) => [x + dx - 0.8, 0, z + dz - 0.8, x + dx + 0.8, 15, z + dz + 0.8])]; }
      else if (kind === "sofa") { const side = rnd() < 0.5 ? -1 : 1, x = side * (HW - 10); parts = [[x - 9, 0, z - 22, x + 9, 14, z + 22], [x + side * 5, 14, z - 22, x + side * 9, 30, z + 22]]; }
      else if (kind === "lamp") { const x = (rnd() - 0.5) * 70; parts = [[x - 1, 0, z - 1, x + 1, 62, z + 1], [x - 6, 56, z - 6, x + 6, 66, z + 6]]; }
      else { const side = rnd() < 0.5 ? -1 : 1, x = side * (HW - 7); parts = [[x - 7, 0, z - 20, x + 7, 70 + rnd() * 30, z + 20]]; }
      if (!parts.every((p) => boxClear(...p))) continue;
      FURNITURE.push({ kind, parts: parts.map((p) => box(...p, kind)) }); placed++;
    }
  }
}
/** Is (x, y, z) inside something solid, or outside the house's walls? */
function solidAt(x, y, z) {
  if (y < 0.6) return true;
  if (z < FINISH_Z - 1 && (Math.abs(x) > HW - 0.6 || y > CONFIG.hallH - 0.6 || z < -10)) return true;
  for (const b of BOXES) if (x > b.x0 - 0.6 && x < b.x1 + 0.6 && y > b.y0 - 0.6 && y < b.y1 + 0.6 && z > b.z0 - 0.6 && z < b.z1 + 0.6) return true;
  return false;
}
/** Where you start again after a crash: just past the last doorway you flew through. */
function respawnAt(cp) { const w = WALLS[cp]; return w ? { x: w.x, y: w.y, z: w.z + 5 } : START; }

// ── WORLD ───────────────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color("#8fd3ff"); // the sky, seen through the window at the end
scene.fog = new THREE.Fog("#f3e3c8", 160, 420);
const camera = new THREE.PerspectiveCamera(70, 1, 0.3, 1600);
function fit() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener("resize", fit); addEventListener("orientationchange", fit); fit();
scene.add(new THREE.HemisphereLight("#fff6e8", "#8a6a4a", 1.5));

const LEN = FINISH_Z;
// Floor: wooden planks. Walls: striped wallpaper over a skirting board. Ceiling: plain, with lights.
const planks = canvasTex(256, 256, (c, w, h) => {

const floor = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.hallW, LEN + 20).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ map: planks, roughness: 0.8 }));
floor.position.set(0, 0, LEN / 2 - 10); scene.add(floor);
const paper = canvasTex(128, 128, (c, w, h) => {
  c.fillStyle = "#f2d6a2"; c.fillRect(0, 0, w, h); c.fillStyle = "#e7c084"; for (let x = 0; x < w; x += 32) c.fillRect(x, 0, 12, h);
  c.fillStyle = "#c98b5a"; for (let y = 16; y < h; y += 32) for (let x = 6; x < w; x += 32) { c.beginPath(); c.arc(x + 16, y, 3, 0, 7); c.fill(); }
}, LEN / 40, CONFIG.hallH / 40);
for (const s of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(LEN + 20, CONFIG.hallH), new THREE.MeshStandardMaterial({ map: paper, roughness: 1 }));
  wall.rotation.y = -s * Math.PI / 2; wall.position.set(s * HW, CONFIG.hallH / 2, LEN / 2 - 10); scene.add(wall);
  const skirt = new THREE.Mesh(new THREE.BoxGeometry(1, 6, LEN + 20), new THREE.MeshStandardMaterial({ color: "#fff8ee" })); skirt.position.set(s * (HW - 0.5), 3, LEN / 2 - 10); scene.add(skirt);
}
const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.hallW, LEN + 20).rotateX(Math.PI / 2), new THREE.MeshStandardMaterial({ color: "#fbf4ea", emissive: "#cfc3b0" }));
ceiling.position.set(0, CONFIG.hallH, LEN / 2 - 10); scene.add(ceiling);
const back = new THREE.Mesh(new THREE.PlaneGeometry(CONFIG.hallW, CONFIG.hallH), new THREE.MeshStandardMaterial({ map: paper })); back.position.set(0, CONFIG.hallH / 2, -10); scene.add(back);
const glowTex = canvasTex(64, 64, (c) => { const g = c.createRadialGradient(32, 32, 0, 32, 32, 32); g.addColorStop(0, "#fff"); g.addColorStop(0.4, "#fff8"); g.addColorStop(1, "#fff0"); c.fillStyle = g; c.fillRect(0, 0, 64, 64); });
for (let z = RL / 2; z < LEN; z += RL) { const lamp = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: "#fff2c0", depthWrite: false })); lamp.scale.set(30, 30, 1); lamp.position.set(0, CONFIG.hallH - 4, z); scene.add(lamp); }
// The walls between rooms, with painted door frames round each doorway.
const dividerPaper = paper.clone(); dividerPaper.repeat.set(CONFIG.hallW / 40, CONFIG.hallH / 40); dividerPaper.needsUpdate = true;

function fixColor() {

  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !botColors.includes(myColor)) return;
  const taken = new Set([...others.map(([, p]) => p.c), ...botColors]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); if (me.g) { scene.remove(me.g); me.g = null; } }
}
const me = Object.assign(onShelf(0, 1), { g: null, raceId: -1, t0: 0, best: 0, lastSend: 0, submitted: -1, shake: 0, aimX: 0, aimY: 0, aimFor: -1, skill: 0.93 });
const input = { left: false, right: false, climb: false, dive: false };

function resetToShelf(r) {
  me.raceId = r.id;
  const live = livePlayers().filter((id) => !(ATTRACT && id === net.sessionId)), total = Math.max(CONFIG.seats, live.length) + (ATTRACT ? 1 : 0);
  Object.assign(me, onShelf(ATTRACT ? total - 1 : Math.max(0, live.indexOf(net.sessionId)), total), { t0: r.phase === "grid" ? r.startAt : Date.now(), aimFor: -1 });
  for (const m of ringMeshes) m.material.color.set("#ffcf3f");
  $("over").hidden = true;
}
function say(what, i) {
  if (what === "ring") { ringMeshes[i].material.color.set("#7dff6a"); beep(990, 0.1); setTimeout(() => beep(1320, 0.12), 80); toast("Ring! +speed", 600); }
  else if (what === "door") { beep(660, 0.1); toast(`Room ${i + 2}`, 800); }
  else if (what === "crash") { me.shake = 1; beep(120, 0.3, "sawtooth", 0.08); toast("Crumpled! Back to the last doorway…", 1300); }
  else if (what === "finish") { if (!me.best || me.ft < me.best) me.best = me.ft; toast(`Out the window! ${ord(racers().findIndex((x) => x.mine) + 1)}`, 2500); beep(660, 0.15); setTimeout(() => beep(880, 0.15), 140); setTimeout(() => beep(1320, 0.35), 280); }
}
function myTick(dt, r, t, now) {
  if (me.raceId !== r.id) resetToShelf(r);
  flyOne(me, r, t, dt, () => (ATTRACT ? botFly(me) : { turn: (input.left ? 1 : 0) - (input.right ? 1 : 0), climb: (input.climb ? 1 : 0) - (input.dive ? 1 : 0) }), ATTRACT ? null : say);
  if (now - me.lastSend > 66) {
    me.lastSend = now;
    const r2 = (v) => +v.toFixed(2);
    net.me.set("k", JSON.stringify({ r: me.raceId, x: r2(me.x), y: r2(me.y), z: r2(me.z), yw: r2(me.yaw), pt: r2(me.pitch), rl: r2(me.roll), vx: +me.vx.toFixed(1), vy: +me.vy.toFixed(1), vz: +me.vz.toFixed(1), sp: +me.sp.toFixed(1), cp: me.cp, rg: me.rg, ft: me.ft, cr: me.cr }));
  }
}

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const fmt = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor((ms % 60000) / 1000)).padStart(2, "0")}.${String(Math.floor((ms % 1000) / 10)).padStart(2, "0")}`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let toastTimer = 0;
function toast(text, ms = 1500) { if (ATTRACT) return; const m = $("msg"); m.textContent = text; m.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => m.classList.remove("on"), ms); }
let board = null, boardFor = -1, lastCount = "", started = 0;
function hud(r, now) {
  const t = Date.now();
  const count = r.phase === "grid" && r.startAt - t < 3000 ? String(Math.max(1, Math.ceil((r.startAt - t) / 1000))) : r.phase === "race" && t - r.startAt < 900 ? "GO!" : "";
  if (count !== lastCount) { lastCount = count; if (count === "GO!") beep(880, 0.4, "square", 0.08); else if (count) beep(440, 0.15, "square", 0.08); }
  $("count").textContent = count;
  if (ATTRACT) { for (const id of ["pos", "info", "time", "net", "hint"]) $(id).textContent = ""; return; }
  const order = racers(), at = order.findIndex((x) => x.mine) + 1;
  $("pos").innerHTML = at ? `${ord(at)} <small>/ ${order.length}</small>` : "";
  $("info").textContent = me.ft ? "Out the window!" : `Room ${Math.min(WALLS.length, me.cp + 2)}/${WALLS.length} · rings ${me.rg}/${RINGS.length}`;
  $("time").innerHTML = `${fmt(me.ft || (r.phase === "race" ? Math.max(0, t - me.t0) : 0))}<small>${Math.round(me.sp * 3)} km/h</small>`;
  $("hint").textContent = r.phase === "grid" && r.startAt - t >= 3000 ? "Next flight starting…" : me.ft && r.phase === "race" ? "Waiting for the others…" :
    now - started < 15000 ? (touchUI ? "◀ ▶ turn · ▲ climb · ▼ dive · fly through the doorways, ride the warm air up" : "←/→ turn · ↑ climb · ↓ dive · fly through the doorways, ride the warm air up") : "";
  const n = livePlayers().length;
  $("net").textContent = net.offline ? "Offline: playing with bots" : dropped ? "Reconnecting…" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  $("over").hidden = r.phase !== "done";
  if (r.phase === "done") {
    $("msg").classList.remove("on"); // a finish toast would sit on top of the results card
    const win = r.results[0];
    $("otitle").textContent = win && win.ft ? (win.id === net.sessionId ? "You win!" : `${win.n} wins!`) : "Results";
    $("results").innerHTML = r.results.map((x) => `<li class="${x.id === net.sessionId ? "me" : ""}">${esc(x.n)}<em>${x.rg} ring${x.rg === 1 ? "" : "s"}</em><span>${x.ft ? fmt(x.ft) : "DNF"}</span></li>`).join("");
    $("next").textContent = `Next flight in ${Math.max(0, Math.ceil((r.endsAt - t) / 1000))}s`;
    if (boardFor !== r.id) { boardFor = r.id; showBoard(r); }
  }
}
function showBoard(r) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li class=\"note\">Leaderboards need a connection.</li>"; return; }
  const mine = r.results.find((x) => x.id === net.sessionId);
  const submit = mine && mine.ft && me.submitted !== r.id ? board.submit(Math.max(0, 600000 - mine.ft)).catch(() => null) : Promise.resolve();
  me.submitted = r.id;
  submit.then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${fmt(600000 - e.score)}</span></li>`).join("") : "<li class=\"note\">No flights yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li class=\"note\">Couldn't load the leaderboard.</li>"; });
}
function again() { const r = race(); if (r && r.phase === "done" && isHost()) newRace(r.id + 1); }
$("again").onclick = () => { if (isHost()) again(); else net.send("again", {}); };

// ── INPUT ───────────────────────────────────────────────────────────────────────────
const touchUI = matchMedia("(pointer: coarse)").matches && !ATTRACT;
$("padL").hidden = $("padR").hidden = !touchUI;
document.body.classList.toggle("touch", touchUI);
const wakeAudio = () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} } };
// Keys by where they sit on the keyboard (e.code), so they still work with Shift or Caps Lock held.
const KEYS = { ArrowLeft: "left", KeyA: "left", ArrowRight: "right", KeyD: "right", ArrowUp: "climb", KeyW: "climb", ArrowDown: "dive", KeyS: "dive" };
const held = new Set(); // the keys that are down right now: letting go of A while Left is still held keeps turning
addEventListener("keydown", (e) => { wakeAudio(); const k = KEYS[e.code]; if (k) { e.preventDefault(); held.add(e.code); input[k] = true; } });
addEventListener("keyup", (e) => { const k = KEYS[e.code]; held.delete(e.code); if (k) input[k] = [...held].some((c) => KEYS[c] === k); });
// The tab lost focus: the keyups never arrive, so let go of everything.
addEventListener("blur", () => { held.clear(); for (const k in input) input[k] = false; for (const b of document.querySelectorAll(".pad button")) b.classList.remove("on"); });
for (const b of document.querySelectorAll(".pad button")) {
  const k = b.dataset.k, on = (v) => { input[k] = v; b.classList.toggle("on", v); };
  b.addEventListener("pointerdown", (e) => { e.preventDefault(); wakeAudio(); b.setPointerCapture(e.pointerId); on(true); });
  for (const ev of ["pointerup", "pointercancel"]) b.addEventListener(ev, () => on(false));
}
renderer.domElement.addEventListener("pointerdown", wakeAudio);
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
const views = new Map(); // id -> drawn plane for everyone but me
function viewOf(id, color, name) {
  let v = views.get(id);
  if (v && v.color !== color) { scene.remove(v.g); views.delete(id); v = null; } // they changed color
  if (!v) { v = { g: makePlane(color, ATTRACT ? "" : name), color, x: 0, y: 0, z: 0, yaw: 0, pitch: 0, roll: 0, raw: "", fresh: true, trailAt: 0 }; views.set(id, v); }
  return v;
}
/** Ease a drawn plane toward where it said it was, plus how far it has flown since. */
function follow(v, k, dt, now) {
  const key = `${k.x},${k.y},${k.z}`;
  if (v.raw !== key) Object.assign(v, { raw: key, sx: k.x, sy: k.y, sz: k.z, vx: k.vx || 0, vy: k.vy || 0, vz: k.vz || 0, at: now });
  const age = Math.min(0.25, (now - v.at) / 1000), crashed = k.cr > 0, tx = v.sx + (crashed ? 0 : v.vx * age), ty = v.sy + (crashed ? 0 : v.vy * age), tz = v.sz + (crashed ? 0 : v.vz * age);
  if (v.fresh || Math.hypot(tx - v.x, ty - v.y, tz - v.z) > 20) Object.assign(v, { x: tx, y: ty, z: tz, fresh: false });
  const e = 1 - Math.pow(0.001, dt);
  v.x += (tx - v.x) * e; v.y += (ty - v.y) * e; v.z += (tz - v.z) * e;
  v.yaw = angle(v.yaw + angle(k.yw - v.yaw) * e); v.pitch += (k.pt - v.pitch) * e; v.roll += (k.rl - v.roll) * e;
}
/** A faint trail of the plane's color behind it. */
function trail(p, color, now) {
  if (p.cr || now < (p.trailAt || 0)) return;
  const moved = p.tz === undefined || Math.abs(p.z - p.tz) > 0.5; p.tz = p.z; p.trailAt = now + 40;
  if (!moved) return; // parked on the shelf: no trail
  const d = dirOf(p.yaw, p.pitch); emit(p.x - d.x * 2.2, p.y - d.y * 2.2, p.z - d.z * 2.2, color, 1, 0.3, 0.9, 0);
}
let last = performance.now(), lastHb = 0, lastHud = 0, camYaw = 0;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3(), shakeV = new THREE.Vector3();
function frame(now) {
  requestAnimationFrame(frame);
  const realNow = performance.now(); // timed on the real clock: after a long freeze the rAF time can be from before the wake
  if (lastFrameAt && realNow - lastFrameAt > 1000) { wakeHold = realNow + 700; host.wasHost = false; host.last = null; } lastFrameAt = realNow; // woke from a freeze or a background tab: another player may have run the race meanwhile, so let their state arrive, then adopt it like a new host
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(dt, now); else host.wasHost = false;
  const r = race(), t = Date.now();
  if (r) myTick(dt, r, t, now);
  // everyone else's planes
  const seen = new Set(), live = new Set(livePlayers());
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    if (id === net.sessionId || !live.has(id)) continue;
    const k = parse(p.k, null); if (!k || !r || k.r !== r.id) continue;
    seen.add(id); const v = viewOf(id, p.c || "#ccc", p.n || "Player"); follow(v, k, dt, now); v.cr = k.cr;
    placePlane(v.g, v.x, v.y, v.z, v.yaw, v.pitch, v.roll, k.cr ? (k.cr - t) / 1000 : 0); hideNearCamera(v.g); trail(v, p.c || "#ccc", now);
  }
  const hostBots = isHost();
  for (const b of botList()) {
    seen.add(b.i); const v = viewOf(b.i, b.c, b.n);
    if (hostBots) { const hb = host.bots.get(b.i); Object.assign(v, { x: hb.x, y: hb.y, z: hb.z, yaw: hb.yaw, pitch: hb.pitch, roll: hb.roll, cr: hb.cr }); } else { follow(v, b, dt, now); v.cr = b.cr; }
    placePlane(v.g, v.x, v.y, v.z, v.yaw, v.pitch, v.roll, b.cr ? (b.cr - t) / 1000 : 0); hideNearCamera(v.g); trail(v, b.c, now);
  }
  for (const [id, v] of views) if (!seen.has(id)) { scene.remove(v.g); views.delete(id); }
  if (!me.g) me.g = makePlane(myColor, "");
  placePlane(me.g, me.x, me.y, me.z, me.yaw, me.pitch, me.roll, me.cr ? (me.cr - t) / 1000 : 0); trail(me, myColor, now);
  // the next doorway glows; rings spin
  const nextDoor = me.cp + 1;
  doorFrames.forEach((g, k) => g.children.forEach((m) => { m.material.emissive.set(k === nextDoor && !ATTRACT ? "#ffb000" : "#000000"); m.material.emissiveIntensity = 0.4 + Math.sin(now / 200) * 0.3; }));
  ringMeshes.forEach((m, i) => { m.rotation.z += dt * (i % 2 ? 1 : -1); });
  airTex.offset.y -= dt * 0.8;
  tickParts(dt);
  // chase camera: behind and a little above, swinging round smoothly
  camYaw = angle(camYaw + angle(me.yaw - camYaw) * Math.min(1, dt * 3));
  const back = camera.aspect < 1 ? 12 : 9.5, up = camera.aspect < 1 ? 4 : 3;
  camPos.set(me.x - Math.sin(camYaw) * back, me.y + up - Math.sin(me.pitch) * 4, me.z - Math.cos(camYaw) * back);
  if (me.z < FINISH_Z - 2) { camPos.x = clamp(camPos.x, -HW + 2, HW - 2); camPos.y = clamp(camPos.y, 2, CONFIG.hallH - 2); }
  camera.position.lerp(camPos, 1 - Math.pow(me.cr ? 0.3 : 0.0005, dt));
  me.shake = Math.max(0, me.shake - dt * 2);
  if (me.shake) camera.position.add(shakeV.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(me.shake * 0.8));
  const d = dirOf(me.yaw, me.pitch * 0.5); camLook.set(me.x + d.x * 8, me.y + d.y * 8 + 0.8, me.z + d.z * 8); // half the pitch: never stare straight down
  const bank = me.roll * 0.25; camera.up.set(Math.cos(camYaw) * Math.sin(bank), Math.cos(bank), -Math.sin(camYaw) * Math.sin(bank)); // lean with the plane a little
  camera.lookAt(camLook);
  const fov = (camera.aspect < 1 ? 82 : 70) + clamp((me.sp - CONFIG.launch) / 30, 0, 1) * 10;
  camera.fov += (fov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
  renderer.render(scene, camera);
  if (r && now - lastHud > 100) { lastHud = now; hud(r, now); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.on("again", () => again());
  net.onDisconnect(() => { dropped = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { dropped = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...shared("bots", []).map((b) => b.c)]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { countdown: 1500, resultsFor: 1500, seats: 6 });
  started = performance.now();
  if (new URLSearchParams(location.search).has("test")) window.__test = { race, botList, me, racers, WALLS, RINGS, FURNITURE }; // for test scripts only
  requestAnimationFrame(frame);
})();
</script>
